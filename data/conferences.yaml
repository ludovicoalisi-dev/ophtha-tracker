        city: Las Vegas
        country: USA
        venue: Venetian Expo & Hotel
        start: 2027-11-12
        end: 2027-11-15
        verified: false
        source: https://aao.org/annual-meeting/past-and-future-meetings
        notes: Dato riportato dalla ricerca web sulla pagina ufficiale AAO, non letto direttamente.
        deadlines: []

  - id: ascrs
