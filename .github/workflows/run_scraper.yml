name: Update Ophthalmology Conferences

on:
  schedule:
    - cron: "0 6 1,15 * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "data/conferences.json"
      - "README.md"

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libxml2-dev

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("jsonlite", "rvest", "httr2", "stringr", "lubridate", "dplyr"))'

      - name: Run Scraper
        run: |
          Rscript scripts/scraper.R

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/conferences.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update conferences database [skip ci]" && git push)

