# Database dei congressi monitorati.
#
# Struttura:
#   series   -> la società / il congresso ricorrente (ARVO, ESCRS, ...)
#   editions -> la singola edizione annuale, con sede, date e scadenze
#   watch    -> pagine controllate ogni 15 giorni per rilevare cambiamenti
#
# Regole:
#   - le date sono in formato ISO (YYYY-MM-DD);
#   - `verified: true` SOLO se il dato è stato letto sul sito ufficiale
#     del congresso; altrimenti `false` e `source` indica da dove viene;
#   - tipi di scadenza ammessi: abstract_open, abstract, late_breaking,
#     early_bird, registration.

series:
  # ---------------------------------------------------------------- INTERNAZIONALI
  - id: arvo
    name: ARVO Annual Meeting
    society: Association for Research in Vision and Ophthalmology
    scope: international
    subspecialty: Ricerca / Generale
    website: https://www.arvo.org/annual-meeting/
    watch:
      - https://www.arvo.org/annual-meeting/
      - https://www.arvo.org/annual-meeting/abstracts/
    editions:
      - year: 2027
        city: San Diego
        country: USA
        venue: San Diego Convention Center
        start: 2027-05-02
        end: 2027-05-06
        verified: false
        source: https://retinatoday.com/calendar/2027
        notes: >-
          Date e sede da calendari di terze parti. Il sito ARVO blocca i robot
          (HTTP 403): le scadenze vanno controllate a mano. Serve membership
          ARVO attiva per sottomettere.
        deadlines:
          - type: abstract
            date: 2026-12-05
            verified: true
            source: https://www.arvo.org/annual-meeting/
            note: Confermata manualmente il 24/10/2026

