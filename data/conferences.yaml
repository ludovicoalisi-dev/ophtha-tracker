        country: USA
        venue: San Diego Convention Center
        start: 2027-04-02
        end: 2027-04-05
        verified: false
        source: https://www.ascrs.org/meetings/Next-Year
        notes: Dato riportato dalla ricerca web sulla pagina ufficiale ASCRS; la sede viene da sandiego.org.
