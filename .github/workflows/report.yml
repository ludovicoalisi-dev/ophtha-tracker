name: Report deadline congressi

on:
  schedule:
    - cron: "0 6 1,15 * *" # 1 e 15 di ogni mese, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency: report

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install .

      - name: Controlla pagine e genera report
        run: python -m ophtha_tracker --report report.md

      - name: Salva snapshot delle pagine
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots
          git diff --staged --quiet || (git commit -m "chore: aggiorna snapshot pagine congressi [skip ci]" && git push)

      - name: Pubblica il report come issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create deadline-report --color 0E8A16 \
            --description "Report automatico deadline congressi" --force
          url=$(gh issue create \
            --title "📅 Deadline congressi — $(date +%d/%m/%Y)" \
            --body-file report.md \
            --label deadline-report \
            --assignee "${{ github.repository_owner }}")
          echo "Creata $url"
          # Chiude i report precedenti: resta aperto solo il più recente.
          for n in $(gh issue list --label deadline-report --state open --json number --jq '.[].number'); do
            [ "$n" = "${url##*/}" ] || gh issue close "$n"
          done
