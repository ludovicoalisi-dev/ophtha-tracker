name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install ".[dev]"

      - name: Valida data/conferences.yaml
        run: python -m ophtha_tracker --validate-only

      - name: Esegui test
        run: pytest -q
